name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[gui,dev]"
      - name: Check tag matches package version
        shell: bash
        run: |
          PKG=$(python -c "import sys; sys.path.insert(0,'src'); import mailtrace_core; print(mailtrace_core.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG tag=$TAG"
          test "$PKG" = "$TAG" || { echo "tag v$TAG does not match __version__ $PKG"; exit 1; }
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build executable and checksums
        run: python scripts/build_release.py
      - name: Smoke-test the built CLI
        shell: bash
        run: ./dist/MailTrace/mailtrace-cli.exe analyze sample_emails/02_spoofed_bank_spf_fail.eml --offline | head -20
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MailTrace ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/MailTrace-*-windows-x64.zip
            release/MailTrace-Setup-*.exe
            release/SHA256SUMS
